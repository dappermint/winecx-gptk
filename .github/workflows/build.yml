name: build winecx gptk runtime

on:
  workflow_dispatch:
  push:
    branches: [main]

# pinned by hand. an unpinned clone makes two builds of the same tree
# incomparable, which is how a deployment mistake got misread for days as the
# base having moved underneath us. the nixpkgs rev is a branch tip captured on
# 2026-08-03, for the same reason: a branch ref moves, so the runtime's
# freetype, gnutls and moltenvk would change without a commit here saying so.
env:
  WINECX_COMMIT: aa5ddd8eae4d785a95a6199f17e9deed6625f07f
  NIXPKGS_REV: ac62194c3917d5f474c1a844b6fd6da2db95077d

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: ensure rosetta
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true && echo "rosetta ok"

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            extra-platforms = x86_64-darwin

      - name: clone winecx
        run: |
          git clone https://github.com/PhoenicisOrg/winecx.git winecx
          git -C winecx checkout --detach "$WINECX_COMMIT"
          git -C winecx --no-pager log -1 --oneline

      - name: apply patches
        run: |
          for p in "$PWD"/patches/*.patch; do
            echo "applying $(basename "$p")"
            git -C winecx apply --verbose "$p"
          done

      - name: llvm-mingw for the PE half
        run: |
          curl -sL -o llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-macos-universal.tar.xz
          tar -xf llvm-mingw.tar.xz
          mv llvm-mingw-* llvm-mingw

      - name: nix toolchain and x86_64 libs
        run: |
          NIXPKGS="github:NixOS/nixpkgs/$NIXPKGS_REV"
          tools=$(nix build --no-link --print-out-paths \
            "$NIXPKGS#bison" "$NIXPKGS#flex" "$NIXPKGS#pkg-config")
          toolpath=""
          for t in $tools; do toolpath="$t/bin:$toolpath"; done
          echo "NIX_TOOL_PATH=$toolpath" >> "$GITHUB_ENV"

          outs=""
          for p in freetype gnutls libpng zlib brotli bzip2 nettle libtasn1 libidn2 p11-kit libunistring gmp moltenvk vulkan-headers; do
            for o in dev out; do
              if path=$(nix build --no-link --print-out-paths \
                "$NIXPKGS#legacyPackages.x86_64-darwin.$p.$o" 2>/dev/null); then
                outs="$outs $path"
              fi
            done
          done
          echo "$outs" | tr ' ' '\n' | grep . > store-outs.txt
          pcp=""
          incs=""
          ldfs=""
          for d in $outs; do
            [ -d "$d/lib/pkgconfig" ] && pcp="$d/lib/pkgconfig:$pcp"
            [ -d "$d/include" ] && incs="$incs -I$d/include"
            [ -d "$d/lib" ] && ldfs="$ldfs -L$d/lib"
          done
          {
            echo "NIX_PKG_CONFIG_PATH=$pcp"
            echo "NIX_INCS=$incs"
            echo "NIX_LDFS=$ldfs"
          } >> "$GITHUB_ENV"
          cat store-outs.txt

      - name: configure
        run: |
          export PATH="$NIX_TOOL_PATH$PWD/llvm-mingw/bin:$PATH"
          export SDKROOT="$(/usr/bin/xcrun --show-sdk-path)"
          export CC="/usr/bin/clang -arch x86_64"
          export CXX="/usr/bin/clang++ -arch x86_64"
          export PKG_CONFIG_PATH="$NIX_PKG_CONFIG_PATH"
          export CFLAGS="-O2 -Wno-error=implicit-function-declaration $NIX_INCS"
          export LDFLAGS="$NIX_LDFS"
          export ac_cv_lib_soname_freetype="libfreetype.6.dylib"
          export ac_cv_lib_soname_gnutls="libgnutls.30.dylib"
          # wine dlopens MoltenVK by soname; the bundled copy is found via
          # the loader fallback path whisky already sets for its runtime
          export ac_cv_lib_soname_MoltenVK="libMoltenVK.dylib"
          mkdir build && cd build
          ../winecx/configure \
            --host=x86_64-apple-darwin24 \
            --enable-archs=i386,x86_64 \
            --disable-tests \
            --without-x --without-wayland --without-gstreamer \
            --without-oss --without-alsa --without-pulse --without-sane \
            --without-usb --without-v4l2 --without-pcap --without-capi \
            --without-opencl --without-ffmpeg --without-cups \
            --prefix=/opt/whiskywine || {
              echo "==== core tests section ===="
              sed -n '100,500p' config.log
              exit 1
            }

      - name: make
        run: |
          export PATH="$NIX_TOOL_PATH$PWD/llvm-mingw/bin:$PATH"
          cd build
          make -j"$(sysctl -n hw.ncpu)"

      - name: unpack wine-mono and wine-gecko
        run: |
          # the extracted form, which is what the stock whisky engine ships and
          # what mscoree and mshtml load straight out of the datadir. the .msi
          # form works too but appwiz then installs a copy into every prefix,
          # costing ~180MB per bottle. versions come from winecx's own
          # dlls/appwiz.cpl/addons.c, which is what the loaders look for:
          # metahost.c wants wine-mono-$MONO_VERSION, nsembed.c wants
          # wine-gecko-$GECKO_VERSION-$arch. addons.c only carries .msi hashes,
          # so the tarball hashes are pinned here instead.
          set -eu
          mono_ver=$(sed -n 's/^#define MONO_VERSION "\(.*\)"/\1/p' winecx/dlls/appwiz.cpl/addons.c)
          gecko_ver=$(sed -n 's/^#define GECKO_VERSION "\(.*\)"/\1/p' winecx/dlls/appwiz.cpl/addons.c)
          [ "$mono_ver" = "9.4.0" ] && [ "$gecko_ver" = "2.47.4" ] || {
            echo "winecx now wants mono $mono_ver, gecko $gecko_ver; update the pinned hashes"
            exit 1
          }

          fetch() {
            curl -fsSL -o "$2" "$1"
            got=$(shasum -a 256 "$2" | cut -d' ' -f1)
            [ "$got" = "$3" ] || { echo "hash mismatch for $2: $got != $3"; exit 1; }
          }

          mkdir -p addons/mono addons/gecko
          fetch "https://dl.winehq.org/wine/wine-mono/$mono_ver/wine-mono-$mono_ver-x86.tar.xz" \
                mono.tar.xz fd772219aacf46b825fa891a647af4a9ddf8439320101c231918b2037bf13858
          fetch "https://dl.winehq.org/wine/wine-gecko/$gecko_ver/wine-gecko-$gecko_ver-x86.tar.xz" \
                gecko-x86.tar.xz 2cfc8d5c948602e21eff8a78613e1826f2d033df9672cace87fed56e8310afb6
          fetch "https://dl.winehq.org/wine/wine-gecko/$gecko_ver/wine-gecko-$gecko_ver-x86_64.tar.xz" \
                gecko-x64.tar.xz fd88fc7e537d058d7a8abf0c1ebc90c574892a466de86706a26d254710a82814

          tar -xJf mono.tar.xz -C addons/mono
          tar -xJf gecko-x86.tar.xz -C addons/gecko
          tar -xJf gecko-x64.tar.xz -C addons/gecko
          [ -d "addons/mono/wine-mono-$mono_ver" ] || { echo "mono tarball layout changed"; exit 1; }
          [ -d "addons/gecko/wine-gecko-$gecko_ver-x86_64" ] || { echo "gecko tarball layout changed"; exit 1; }
          du -sh addons/mono addons/gecko

      - name: install and package
        run: |
          export PATH="$NIX_TOOL_PATH$PWD/llvm-mingw/bin:$PATH"
          cd build
          make install DESTDIR="$PWD/../staging"
          mkdir -p "$PWD/../staging/opt/whiskywine/share/wine/mono" "$PWD/../staging/opt/whiskywine/share/wine/gecko"
          cp -R "$PWD/../addons/mono"/* "$PWD/../staging/opt/whiskywine/share/wine/mono/"
          cp -R "$PWD/../addons/gecko"/* "$PWD/../staging/opt/whiskywine/share/wine/gecko/"
          cd ..
          mkdir -p Libraries/Wine
          cp -R staging/opt/whiskywine/bin Libraries/Wine/bin
          cp -R staging/opt/whiskywine/lib Libraries/Wine/lib
          cp -R staging/opt/whiskywine/share Libraries/Wine/share
          # CW HACK 22144: on apple without a preloader the loader expects its
          # own binary to be named wineloader; whisky expects wine64
          cp Libraries/Wine/bin/wine Libraries/Wine/bin/wineloader
          ln -s wine Libraries/Wine/bin/wine64

          # bundle the nix dylib closure flat into Wine/lib and rewrite
          # store references to loader-relative so the tarball is portable
          LIBDIR="$PWD/Libraries/Wine/lib"
          scan() { otool -L "$1" 2>/dev/null | awk '/\/nix\/store/{print $1}'; }

          queue=""
          for d in $(cat store-outs.txt); do
            for so in libfreetype.6.dylib libgnutls.30.dylib libMoltenVK.dylib; do
              [ -f "$d/lib/$so" ] && queue="$queue $d/lib/$so"
            done
          done
          while [ -n "$queue" ]; do
            next=""
            for lib in $queue; do
              base=$(basename "$lib")
              [ -e "$LIBDIR/$base" ] && continue
              cp -L "$lib" "$LIBDIR/$base"
              chmod u+w "$LIBDIR/$base"
              next="$next $(scan "$LIBDIR/$base" | tr '\n' ' ')"
            done
            queue=""
            for l in $next; do
              [ -e "$LIBDIR/$(basename "$l")" ] || queue="$queue $l"
            done
          done

          # two iconvs are needed, and they are not interchangeable: libintl
          # wants plain _iconv (only macOS's /usr/lib copy exports it) while
          # libidn2 and libunistring want GNU's _libiconv (only nix's copy has
          # it). so libintl is pointed at the system library and everything
          # else keeps the bundled one.
          fixup() {
            local f="$1"
            local rel
            rel=$(python3 -c "import os,sys; print(os.path.relpath(sys.argv[1], os.path.dirname(sys.argv[2])))" "$LIBDIR" "$f")
            chmod u+w "$f" 2>/dev/null || true
            # the id, not only the dependencies: a dylib that still calls itself
            # /nix/store/... cannot be dlopened off the builder, which silently
            # cost us fonts, vulkan and tls in every build up to rt7
            case "$f" in
              *.dylib) install_name_tool -id "@loader_path/$(basename "$f")" "$f" 2>/dev/null || true ;;
            esac
            for ref in $(scan "$f"); do
              if [[ "$(basename "$ref")" == libiconv*.dylib && "$(basename "$f")" == libintl* ]]; then
                install_name_tool -change "$ref" "/usr/lib/libiconv.2.dylib" "$f" 2>/dev/null || true
              else
                install_name_tool -change "$ref" "@loader_path/$rel/$(basename "$ref")" "$f" 2>/dev/null || true
              fi
            done
            codesign -f -s - "$f" 2>/dev/null || true
          }
          for f in "$LIBDIR"/*.dylib; do fixup "$f"; done
          find Libraries/Wine/bin -type f | while read -r f; do fixup "$f"; done
          find Libraries/Wine/lib/wine -name "*.so" | while read -r f; do fixup "$f"; done

          # the reference runtime ships both names; match it
          ln -sf libfreetype.6.dylib "$LIBDIR/libfreetype.dylib"

          # the unix modules dlopen libgnutls/libfreetype/libMoltenVK by bare
          # soname. dlopen searches the caller's rpaths, and lib/wine/<arch>-unix
          # is two levels below the bundled dylibs, so without this entry none of
          # them resolve: no tls, no fonts, no vulkan. reference runtimes carry it.
          for f in Libraries/Wine/lib/wine/*-unix/*.so; do
            install_name_tool -add_rpath "@loader_path/../../" "$f" 2>/dev/null || true
            codesign -f -s - "$f" 2>/dev/null || true
          done

          cat > Libraries/WhiskyWineVersion.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>gptkCapable</key>
            <true/>
            <key>version</key>
            <dict>
              <key>major</key>
              <integer>4</integer>
              <key>minor</key>
              <integer>0</integer>
              <key>patch</key>
              <integer>0</integer>
            </dict>
          </dict>
          </plist>
          PLIST
      - name: verify the tree is relocatable
        run: |
          # every build up to rt7 shipped dylibs whose own id was a /nix/store
          # path that exists only on the runner, so they could not be dlopened
          # anywhere else and the runtime silently lost fonts, vulkan and tls.
          : > /tmp/badrefs
          find Libraries -type f ! -type l -print0 | while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            # only absolute paths are a problem. @loader_path and bare names
            # both relocate; the reference runtime uses bare names throughout.
            otool -D "$f" 2>/dev/null | sed -n '2p' | grep -E '^/' \
              | grep -vE '^(/usr/lib/|/System/)' \
              | sed "s|^|id $f -> |" >> /tmp/badrefs
            otool -L "$f" 2>/dev/null | tail -n +3 | awk '{print $1}' \
              | grep -E '^/' | grep -vE '^(/usr/lib/|/System/)' \
              | sed "s|^|dep $f -> |" >> /tmp/badrefs
          done
          if [ -s /tmp/badrefs ]; then
            sed 's/^/::error::not relocatable: /' /tmp/badrefs
            echo "$(wc -l < /tmp/badrefs) absolute reference(s); refusing to ship"
            exit 1
          fi
          echo "relocatable: ok"

          # a 64-bit-only tree cannot load syswow64\ntdll.dll, so every 32-bit
          # program dies with c0000135. one build shipped with this empty.
          i386=$(ls Libraries/Wine/lib/wine/i386-windows 2>/dev/null | wc -l | tr -d ' ')
          [ "$i386" -gt 500 ] || { echo "::error::i386-windows has $i386 files"; exit 1; }
          echo "i386 PE half: $i386 files"

      - name: package
        run: |
          tar -czf Libraries.tar.gz Libraries
          shasum -a 256 Libraries.tar.gz | tee Libraries.tar.gz.sha256

      - name: upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: whiskywine-gptk-libraries
          path: |
            Libraries.tar.gz
            Libraries.tar.gz.sha256
          retention-days: 14
